[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fortunevoice-win"
version = "0.1.0"
description = "Local, offline voice dictation for Windows — hold a hotkey, speak, release"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24,<3",
    "pystray>=0.19.5",
    "pillow>=10.0",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9.0"]
dev = ["pytest>=8.0"]

[project.scripts]
fortunevoice = "fortunevoice.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Tests that need a real desktop session (they steal focus for a second) are
# opt-in: `pytest -m live`.
addopts = "-m 'not live and not ui and not e2e'"
markers = [
    "live: drives real Win32 input against a window the test owns",
    "ui: builds real windows; needs a desktop session",
    "e2e: speaks a phrase and decodes it with the real model; slow",
]
